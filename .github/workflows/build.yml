# Compile l'APK automatiquement sur GitHub.
# Résultat : onglet Actions → dernier build → Artifacts, et branche « build-output » (APK + journaux).
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Tests et compilation
        run: gradle --no-daemon assembleRelease testReleaseUnitTest --continue 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TapisSync-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier l'APK et les journaux sur la branche build-output
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/TapisSync.apk 2>/dev/null || true
          cp -r app/build/test-results/testReleaseUnitTest out/tests 2>/dev/null || true
          cp -r app/build/screens out/screens 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
